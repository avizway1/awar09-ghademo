name: 05 - OS and Node vcersion Matrix example

on:
    push:
        branches: ["*"]

jobs:
    node-setup:
        strategy:
            matrix:
                node: 
                    - 22
                    - 24
                    - 26
                os: 
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                    
        runs-on: ${{ matrix.os }}        
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: ${{ matrix.node }}
            - run: npm install
            - run: node index.js
            - run: node -v
