apiVersion: v1
kind: Namespace
metadata:
  name: myapp

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mynginx
  namespace: myapp
  annotations:
    kubernetes.io/change-cause: "my first version of nginx"
spec:
  replicas: 6
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: myfirstcontainer
        image: nginx:1.31.3
        ports:
        - containerPort: 80